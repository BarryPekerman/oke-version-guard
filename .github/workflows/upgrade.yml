name: OKE upgrade

# Upgrades the cluster by ONE minor version or to a newer patch (control plane -> node pools ->
# no-surge node cycling), then verifies health. Two ways to run:
#   * Manual:     Actions -> OKE upgrade -> Run workflow
#   * Automatic:  after "OKE version check" succeeds, IF repo var AUTO_UPGRADE == 'true'
# Flip AUTO_UPGRADE to switch between "auto check + manual upgrade" and "fully automatic".
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target version (blank = auto-detect: newest patch, or next minor)"
        required: false
        default: ""
      snapshot:
        description: "Back up volumes attached to cluster nodes first"
        type: boolean
        default: true
  workflow_run:
    workflows: ["OKE version check"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: oke-version-guard        # shared with check -> never overlap
  cancel-in-progress: false

jobs:
  upgrade:
    # Manual dispatch always runs; auto path only when the check succeeded AND AUTO_UPGRADE is on.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.AUTO_UPGRADE == 'true')
    runs-on: ubuntu-24.04
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLUSTER_ID: ${{ vars.OCI_CLUSTER_ID }}
      # OCI CLI native env auth (scoped API key — no config file needed)
      OCI_CLI_USER: ${{ vars.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ vars.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ vars.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v5

      - name: Install OCI CLI (pinned; jq is preinstalled on the runner)
        run: |
          pipx install oci-cli==3.77.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch kubeconfig
        run: |
          oci ce cluster create-kubeconfig --cluster-id "$OCI_CLUSTER_ID" --region "$OCI_REGION" \
            --file "$HOME/.kube/config" --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Determine target
        id: check
        run: bash scripts/check-version.sh

      # A manual target runs even when the check says OK (e.g. a patch-only upgrade);
      # upgrade.sh validates it (supported + newer patch or exactly one minor up).
      - name: Resolve target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
          CHECK_TARGET: ${{ steps.check.outputs.target }}
          NEEDS: ${{ steps.check.outputs.needs_upgrade }}
        run: |
          target="${INPUT_TARGET:-}"
          if [ -z "$target" ] && [ "$NEEDS" = "true" ]; then target="$CHECK_TARGET"; fi
          echo "version=$target" >> "$GITHUB_OUTPUT"
          echo "target=${target:-none}"

      # kubectl must be within one minor of the apiserver: pin it to the target minor.
      - name: Install kubectl (target minor)
        if: steps.target.outputs.version != ''
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: |
          minor=$(echo "$TARGET_VERSION" | sed -E 's/^v?([0-9]+\.[0-9]+).*/\1/')
          ver=$(curl -fsSL "https://dl.k8s.io/release/stable-${minor}.txt")
          curl -fsSLo kubectl "https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Upgrade
        if: steps.target.outputs.version != ''
        env:
          SNAPSHOT: ${{ github.event_name != 'workflow_dispatch' || inputs.snapshot }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: bash scripts/upgrade.sh

      - name: Report result to issue
        if: always() && steps.target.outputs.version != ''
        uses: actions/github-script@v8
        env:
          TARGET: ${{ steps.target.outputs.version }}
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const target = process.env.TARGET;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'oke-version' });
            const body = ok
              ? `✅ Upgraded to **${target}**. Cluster verified healthy.`
              : `❌ Upgrade to **${target}** failed — see the run logs. The script stops at the first unhealthy state; the control plane may already be upgraded. To finish, re-run **OKE upgrade** with target \`${target}\`.`;
            if (existing.data.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body });
              if (ok) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, state: 'closed' });
            }

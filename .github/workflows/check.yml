name: OKE version check

# Weekly check + manual trigger. Opens/updates a GitHub issue (assigned to and
# @mentioning the repo owner) when the cluster's Kubernetes version risks falling
# out of OCI's supported (free) window, or a newer patch of its minor is out.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # to open/update the alert issue

concurrency:
  group: oke-version-guard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLUSTER_ID: ${{ vars.OCI_CLUSTER_ID }}
      # OCI CLI native env auth (scoped API key — no config file needed)
      OCI_CLI_USER: ${{ vars.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ vars.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ vars.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v5

      - name: Install OCI CLI (pinned; jq is preinstalled on the runner)
        run: |
          pipx install oci-cli==3.77.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check version
        id: check
        run: bash scripts/check-version.sh

      - name: Open/update alert issue
        if: steps.check.outputs.needs_upgrade == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { status, current, target } = ${{ toJSON(steps.check.outputs) }};
            const title = `OKE upgrade needed: ${current} → ${target} (${status})`;
            const body = [
              `**Status:** ${status}`,
              `**Current:** ${current}`,
              `**Target:** ${target}`,
              '',
              {
                URGENT: '⚠️ Cluster is **already off the supported list** — Oracle may be billing $0.10/hr. Upgrade ASAP.',
                WARN:   'Cluster is on the **oldest supported** minor; the next OCI retirement will start billing. Upgrade this cycle.',
                PATCH:  'A newer patch of the current minor is available; OCI retires old patches, so move to it.',
              }[status],
              '',
              'Run the **OKE upgrade** workflow to remediate.',
            ].join('\n');
            // Edits don't notify anyone, so assign the owner and @mention them in a
            // comment on every run — each alerting check then sends a notification.
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'oke-version' });
            if (existing.data.length) {
              const issue_number = existing.data[0].number;
              await github.rest.issues.update({ owner, repo, issue_number, title, body });
              await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [owner] });
              await github.rest.issues.createComment({ owner, repo, issue_number,
                body: `@${owner} still pending: ${current} → ${target} (${status}). Run the **OKE upgrade** workflow.` });
            } else {
              await github.rest.issues.create({ owner, repo, title,
                body: `${body}\n\ncc @${owner}`, labels: ['oke-version'], assignees: [owner] });
            }

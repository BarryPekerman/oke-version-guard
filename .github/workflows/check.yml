name: OKE version check

# Weekly check + manual trigger. Opens/updates a GitHub issue when the cluster's
# Kubernetes version risks falling out of OCI's supported (free) window.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write          # to open/update the alert issue

concurrency:
  group: oke-version-guard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLUSTER_ID: ${{ vars.OCI_CLUSTER_ID }}
      # OCI CLI native env auth (scoped API key — no config file needed)
      OCI_CLI_USER: ${{ vars.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ vars.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ vars.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI + jq
        run: |
          curl -sSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults >/dev/null
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get -qq update && sudo apt-get -qq install -y jq

      - name: Check version
        id: check
        run: bash scripts/check-version.sh

      - name: Open/update alert issue
        if: steps.check.outputs.needs_upgrade == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { status, current, target } = ${{ toJSON(steps.check.outputs) }};
            const title = `OKE upgrade needed: ${current} → ${target} (${status})`;
            const body = [
              `**Status:** ${status}`,
              `**Current:** ${current}`,
              `**Target (one minor up):** ${target}`,
              '',
              status === 'URGENT'
                ? '⚠️ Cluster is **already off the supported list** — Oracle may be billing $0.10/hr. Upgrade ASAP.'
                : 'Cluster is on the **oldest supported** minor; the next OCI retirement will start billing. Upgrade this cycle.',
              '',
              'Run the **OKE upgrade** workflow to remediate.',
            ].join('\n');
            // Edits don't notify anyone, so assign the owner and @mention them in a
            // comment on every run — each WARN/URGENT check then sends a notification.
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'oke-version' });
            if (existing.data.length) {
              const issue_number = existing.data[0].number;
              await github.rest.issues.update({ owner, repo, issue_number, title, body });
              await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [owner] });
              await github.rest.issues.createComment({ owner, repo, issue_number,
                body: `@${owner} still pending: ${current} → ${target} (${status}). Run the **OKE upgrade** workflow.` });
            } else {
              await github.rest.issues.create({ owner, repo, title,
                body: `${body}\n\ncc @${owner}`, labels: ['oke-version'], assignees: [owner] });
            }
